# Render blueprint: the staging API and Postgres, on Render's free tier.
# The frontend is on Cloudflare Pages and the scheduled jobs run from GitHub Actions
# (.github/workflows/jobs.yml); see docs/DEPLOY.md.
#
# Free tier limits to know about:
# - The API sleeps when idle; the first request after that takes about a minute.
#   (The scheduled jobs call it every 15 minutes, which also keeps it awake.)
# - Free Postgres databases are temporary: check the expiry Render shows. Fine for a
#   staging trial, not for real groups.
# - Free services can't run a pre-deploy command, so migrations run at start-up.
# Production (paid plans) is described in docs/DEPLOY.md and added here before launch.

databases:
  - name: secretsanta-db-staging
    plan: free
    databaseName: santa
    user: santa
    region: frankfurt

services:
  - type: web
    name: secretsanta-api-staging
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install uv && uv sync --locked --no-dev
    startCommand: >-
      uv run --no-sync alembic upgrade head &&
      uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    domains:
      - secretsanta-api-staging.dunlopdev.com
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: EMAIL_BACKEND
        value: resend
      - key: EMAIL_FROM
        value: Secret Santa <santa@secretsanta.dunlopdev.com>
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: secretsanta-db-staging
          property: connectionString
      - key: APP_BASE_URL
        value: https://secretsanta-staging.dunlopdev.com
      - key: API_BASE_URL
        value: https://secretsanta-api-staging.dunlopdev.com
      - key: CORS_ORIGINS
        value: https://secretsanta-staging.dunlopdev.com
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
