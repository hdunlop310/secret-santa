# Render blueprint: the API and Postgres for staging and production.
# The frontend is on Cloudflare Pages and the scheduled jobs run from GitHub Actions
# (.github/workflows/jobs.yml); see docs/DEPLOY.md.
#
# Plan names change from time to time: check them against Render's pricing page when
# you apply the blueprint. Both environments need paid plans (pre-deploy commands and an
# always-on API need a paid web service; free Postgres databases expire).

databases:
  - name: secretsanta-db-staging
    plan: basic-256mb
    databaseName: santa
    user: santa
    region: frankfurt
  - name: secretsanta-db
    plan: basic-256mb
    databaseName: santa
    user: santa
    region: frankfurt

envVarGroups:
  - name: secretsanta-shared
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: EMAIL_BACKEND
        value: resend
      - key: EMAIL_FROM
        value: Secret Santa <santa@secretsanta.dunlopdev.com>
      - key: TRUSTED_PROXY_HOPS
        value: "1"

services:
  - type: web
    name: secretsanta-api-staging
    runtime: python
    region: frankfurt
    plan: starter
    branch: main
    rootDir: backend
    buildCommand: pip install uv && uv sync --locked --no-dev
    preDeployCommand: uv run --no-sync alembic upgrade head
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    domains:
      - secretsanta-api-staging.dunlopdev.com
    envVars:
      - fromGroup: secretsanta-shared
      - key: DATABASE_URL
        fromDatabase:
          name: secretsanta-db-staging
          property: connectionString
      - key: APP_BASE_URL
        value: https://secretsanta-staging.dunlopdev.com
      - key: API_BASE_URL
        value: https://secretsanta-api-staging.dunlopdev.com
      - key: CORS_ORIGINS
        value: https://secretsanta-staging.dunlopdev.com
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false

  - type: web
    name: secretsanta-api
    runtime: python
    region: frankfurt
    plan: starter
    branch: production
    rootDir: backend
    buildCommand: pip install uv && uv sync --locked --no-dev
    preDeployCommand: uv run --no-sync alembic upgrade head
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    domains:
      - secretsanta-api.dunlopdev.com
    envVars:
      - fromGroup: secretsanta-shared
      - key: DATABASE_URL
        fromDatabase:
          name: secretsanta-db
          property: connectionString
      - key: APP_BASE_URL
        value: https://secretsanta.dunlopdev.com
      - key: API_BASE_URL
        value: https://secretsanta-api.dunlopdev.com
      - key: CORS_ORIGINS
        value: https://secretsanta.dunlopdev.com
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
