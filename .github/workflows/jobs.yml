name: Scheduled jobs

# Reminders, wish-list-changed emails and deleting old groups. The job is idempotent, so a
# late or repeated run is harmless. GitHub may delay scheduled runs by a few minutes.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    steps:
      - name: Run jobs on ${{ matrix.environment }}
        env:
          API_URL: ${{ vars.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_URL or CRON_SECRET not set for ${{ matrix.environment }}; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$API_URL/internal/jobs/run"
