<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cosy Cabin wish list</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#e9e4da;display:flex;justify-content:center}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF6EE; color: #2B2118; font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; overflow: hidden">
<div style="position: relative; background: #1F4D3A; border-radius: 0 0 28px 28px; padding: 16px 20px 22px; display: flex; flex-direction: column; gap: 8px; overflow: hidden">
<div aria-hidden="true" style="position: absolute; top: 20px; right: 90px; width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.35)"></div>
<div aria-hidden="true" style="position: absolute; top: 70px; right: 36px; width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.3)"></div>
<div aria-hidden="true" style="position: absolute; top: 100px; right: 120px; width: 4px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.35)"></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 8px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F0DDA8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M4.5 7.5l15 9M19.5 7.5l-15 9M9.5 4.5L12 7l2.5-2.5M9.5 19.5L12 17l2.5 2.5"/></svg>
<span style="font-weight: 700; font-size: 14px; letter-spacing: 0.04em; color: #F0DDA8">Secret Santa</span>
</div>
<span style="font-size: 13px; color: #E9E2D2">Alex</span>
</div>
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 28px; line-height: 1.1; color: #FFFFFF">Your wish list</h1>
<p style="margin: 0; font-size: 14px; color: #E9E2D2">Budget £15 to £25</p>
</div>
<div style="box-sizing: border-box; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px; min-height: 44px; background: #FFFFFF; border: 1.5px solid #E7DCCB; border-radius: 14px; padding: 0 14px">
<input id="surprise" type="checkbox" style="width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: #1F4D3A">
<label for="surprise" style="font-size: 14px">Secret surprise: skip my list</label>
</div>
<div style="position: relative; background: #FFFFFF; border: 1.5px solid #E7DCCB; border-radius: 6px 18px 18px 18px; padding: 12px 14px 4px 40px; display: flex; flex-direction: column; gap: 2px">
<div aria-hidden="true" style="position: absolute; left: 14px; top: 14px; width: 12px; height: 12px; border-radius: 6px; background: #FBF6EE; border: 1.5px solid #CDBFA8"></div>
<div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 700">Merino wool socks</span><span style="font-weight: 700; color: #1F4D3A">£18</span></div>
<span style="font-size: 13px; color: #6B5D50">johnlewis.com/socks</span>
<div style="display: flex; gap: 4px; margin-left: -12px"><button type="button" style="height: 44px; padding: 0 12px; border: none; background: transparent; color: #1F4D3A; font-size: 13px; font-weight: 700; text-decoration: underline; font-family: inherit">Edit</button><button type="button" style="height: 44px; padding: 0 12px; border: none; background: transparent; color: #B3262E; font-size: 13px; font-weight: 700; text-decoration: underline; font-family: inherit">Remove</button></div>
</div>
<div style="position: relative; background: #FFFFFF; border: 1.5px solid #E7DCCB; border-radius: 6px 18px 18px 18px; padding: 12px 14px 4px 40px; display: flex; flex-direction: column; gap: 3px">
<div aria-hidden="true" style="position: absolute; left: 14px; top: 14px; width: 12px; height: 12px; border-radius: 6px; background: #FBF6EE; border: 1.5px solid #CDBFA8"></div>
<div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 700">Pour-over coffee set</span><span style="font-weight: 700; color: #5C3B00">£32</span></div>
<span style="font-size: 13px; color: #6B5D50">example-shop.co.uk/coffee</span>
<span style="align-self: flex-start; font-size: 12px; font-weight: 700; color: #5C3B00; background: #FFF1CC; border: 1.5px solid #B7791F; border-radius: 10px; padding: 1px 9px">Over budget (max £25)</span>
<div style="display: flex; gap: 4px; margin-left: -12px"><button type="button" style="height: 44px; padding: 0 12px; border: none; background: transparent; color: #1F4D3A; font-size: 13px; font-weight: 700; text-decoration: underline; font-family: inherit">Edit</button><button type="button" style="height: 44px; padding: 0 12px; border: none; background: transparent; color: #B3262E; font-size: 13px; font-weight: 700; text-decoration: underline; font-family: inherit">Remove</button></div>
</div>
<div style="background: #F5EEDF; border: 1.5px dashed #8C7B68; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 17px">Add an item</span>
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="wtitle" style="font-size: 13px; font-weight: 700">Item</label>
<input id="wtitle" type="text" placeholder="What would you like?" style="height: 44px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #8C7B68; border-radius: 12px; font-size: 15px; font-family: inherit; background: #FFFFFF; color: #2B2118">
</div>
<div style="display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="wurl" style="font-size: 13px; font-weight: 700">Link (optional)</label>
<input id="wurl" type="url" placeholder="https://" style="height: 44px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #8C7B68; border-radius: 12px; font-size: 15px; font-family: inherit; background: #FFFFFF; color: #2B2118">
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="wprice" style="font-size: 13px; font-weight: 700">Price (£)</label>
<input id="wprice" type="text" inputmode="decimal" placeholder="20" style="height: 44px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #8C7B68; border-radius: 12px; font-size: 15px; font-family: inherit; background: #FFFFFF; color: #2B2118">
</div>
</div>
<button type="button" style="height: 48px; border: none; border-radius: 12px; background: #1F4D3A; color: #FFFFFF; font-size: 15px; font-weight: 700; font-family: inherit">Save item</button>
</div>
</div>
</div>
</body>
</html>
