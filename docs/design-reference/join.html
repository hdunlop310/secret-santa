<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cosy Cabin join</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#e9e4da;display:flex;justify-content:center}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF6EE; color: #2B2118; font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; overflow: hidden">
<div style="position: relative; background: #1F4D3A; border-radius: 0 0 32px 32px; padding: 18px 20px 26px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
<div aria-hidden="true" style="position: absolute; top: 22px; right: 40px; width: 8px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.35)"></div>
<div aria-hidden="true" style="position: absolute; top: 80px; right: 100px; width: 5px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.3)"></div>
<div aria-hidden="true" style="position: absolute; top: 120px; right: 30px; width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.3)"></div>
<div aria-hidden="true" style="position: absolute; top: 170px; right: 140px; width: 4px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.35)"></div>
<div style="display: flex; align-items: center; gap: 8px">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F0DDA8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M4.5 7.5l15 9M19.5 7.5l-15 9M9.5 4.5L12 7l2.5-2.5M9.5 19.5L12 17l2.5 2.5"/></svg>
<span style="font-weight: 700; font-size: 14px; letter-spacing: 0.04em; color: #F0DDA8">Secret Santa</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; margin-top: 8px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #F0DDA8">You're invited</span>
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 34px; line-height: 1.08; color: #FFFFFF">Family Secret Santa</h1>
<p style="margin: 0; font-size: 14px; color: #E9E2D2">Hosted by Sam</p>
</div>
<div style="display: flex; gap: 8px; margin-top: 4px">
<span style="background: #F0DDA8; color: #2B2118; font-size: 13px; font-weight: 700; border-radius: 14px; padding: 4px 12px">20 Dec 2026</span>
<span style="background: #F0DDA8; color: #2B2118; font-size: 13px; font-weight: 700; border-radius: 14px; padding: 4px 12px">£15 to £25</span>
</div>
</div>
<div style="box-sizing: border-box; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px">
<div style="background: #FFFFFF; border: 1.5px solid #E7DCCB; border-radius: 16px; padding: 10px 14px; font-size: 14px; color: #4A3D31">
<span style="font-weight: 700; color: #2B2118">From Sam:</span> one gift each, wrapped and tagged. See you there.
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="jname" style="font-size: 13px; font-weight: 700">Your name</label>
<input id="jname" type="text" placeholder="How the group knows you" style="height: 44px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #8C7B68; border-radius: 12px; font-size: 15px; font-family: inherit; background: #FFFFFF; color: #2B2118">
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<label for="jemail" style="font-size: 13px; font-weight: 700">Your email</label>
<input id="jemail" type="email" placeholder="you@email.com" style="height: 44px; box-sizing: border-box; padding: 0 14px; border: 1.5px solid #8C7B68; border-radius: 12px; font-size: 15px; font-family: inherit; background: #FFFFFF; color: #2B2118">
</div>
<button type="button" style="height: 52px; border: none; border-radius: 14px; background: #B3262E; color: #FFFFFF; font-size: 16px; font-weight: 700; font-family: inherit">Join this Secret Santa</button>
</div>
</div>
</body>
</html>
