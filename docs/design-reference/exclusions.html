<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cosy Cabin exclusions</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#e9e4da;display:flex;justify-content:center}
a{color:#1F4D3A}a:hover{color:#B3262E}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF6EE; color: #2B2118; font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; overflow: hidden">
<div style="position: relative; background: #1F4D3A; border-radius: 0 0 28px 28px; padding: 6px 20px 20px; display: flex; flex-direction: column; gap: 6px; overflow: hidden">
<div aria-hidden="true" style="position: absolute; top: 60px; right: 36px; width: 7px; height: 7px; border-radius: 4px; background: rgba(255,255,255,0.35)"></div>
<div aria-hidden="true" style="position: absolute; top: 90px; right: 100px; width: 5px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.3)"></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="dashboard.html" style="display: flex; align-items: center; min-height: 44px; color: #F0DDA8; font-size: 14px; font-weight: 700; text-decoration: none">Back to group</a>
<span style="font-size: 12px; font-weight: 700; color: #F0DDA8; border: 1.5px solid #F0DDA8; border-radius: 12px; padding: 2px 10px">Admin</span>
</div>
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 28px; line-height: 1.1; color: #FFFFFF">Who can't be matched?</h1>
</div>
<div style="box-sizing: border-box; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px">
<div style="background: #FFFFFF; border: 1.5px solid #E7DCCB; border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 4px">
<div style="display: grid; grid-template-columns: 50px repeat(5, minmax(0, 1fr)); gap: 4px; align-items: end">
<span style="font-size: 10px; color: #6B5D50; line-height: 1.1">Giver / giftee</span>
<span style="font-size: 12px; font-weight: 700; text-align: center">Sam</span>
<span style="font-size: 12px; font-weight: 700; text-align: center">Alex</span>
<span style="font-size: 12px; font-weight: 700; text-align: center">Priya</span>
<span style="font-size: 12px; font-weight: 700; text-align: center">Jo</span>
<span style="font-size: 12px; font-weight: 700; text-align: center">Mia</span>
</div>
<div style="display: grid; grid-template-columns: 50px repeat(5, minmax(0, 1fr)); gap: 4px; align-items: center">
<span style="font-size: 12px; font-weight: 700">Sam</span>
<button type="button" disabled aria-label="Sam to Sam, not applicable" style="height: 44px; border: 1.5px solid #E7DCCB; border-radius: 10px; background: #EDE4D3"></button>
<button type="button" aria-label="Sam to Alex, blocked" style="height: 44px; border: 1.5px solid #B3262E; border-radius: 10px; background: #B3262E; color: #FFFFFF; font-size: 18px; font-weight: 700; font-family: inherit">×</button>
<button type="button" aria-label="Sam to Priya, allowed" style="height: 44px; border: 1.5px dashed #8C7B68; border-radius: 10px; background: #FFFFFF"></button>
<button type="button" aria-label="Sam to Jo, allowed" style="height: 44px; border: 1.5px dashed #8C7B68; border-radius: 10px; background: #FFFFFF"></button>
<button type="button" aria-label="Sam to Mia, allowed" style="height: 44px; border: 1.5px dashed #8C7B68; border-radius: 10px; background: #FFFFFF"></button>
<span style="font-size: 12px; font-weight: 700">Alex</span>
<button type="button" aria-label="Alex to Sam, blocked" style="height: 44px; border: 1.5px solid #B3262E; border-radius: 10px; background: #B3262E; color: #FFFFFF; font-size: 18px; font-weight: 700; font-family: inherit">×</button>
<button type="button" disabled aria-label="Alex to Alex, not applicable" style="height: 44px; border: 1.5px solid #E7DCCB; border-radius: 10px; background: #EDE4D3"></button>
<button type="button" aria-label="Alex to Priya, allowed" style="height: 44px; border: 1.5px dashed #8C7B68; border-radius: 10px; background: #FFFFFF"></button>
<button type="button" aria-label="Alex to Jo, allowed" style="height: 44px; border: 1.5px dashed #8C7B68; border-radius: 10px; background: #FFFFFF"></button>
<button type="button" aria-label="Alex to Mia, allowed" style="height: 44px; border: 1.5px dashed #8C7B68; border-radius: 10px; background: #FFFFFF"></button>
<span style="font-size: 12px; font-weight: 700">Priya</span>
<button type="button" aria-label="Priya to Sam, allowed" style="height: 44px; border: 1.5px dashed #8C7B68; border-radius: 10px; background: #FFFFFF"></button>
<button type="button" aria-label="Priya to Alex, allowed" style="height: 44px; border: 1.5px dashed #8C7B68; border-radius: 10px; background: #FFFFFF"></button>
<button type="button" disabled aria-label="Priya to Priya, not applicable" style="height: 44px; border: 1.5px solid #E7DCCB; border-radius: 10px; background: #EDE4D3"></button>
<button type="button" aria-label="Priya to Jo, blocked" style="height: 44px; border: 1.5px solid #B3262E; border-radius: 10px; background: #B3262E; color: #FFFFFF; font-size: 18px; font-weight: 700; font-family: inherit">×</button>
<button type="button" aria-label="Priya to Mia, allowed" style="height: 44px; border: 1.5px dashed #8C7B68; border-radius: 10px; background: #FFFFFF"></button>
<span style="font-size: 12px; font-weight: 700">Jo</span>
<button type="button" aria-label="Jo to Sam, allowed" style="height: 44px; border: 1.5px dashed #8C7B68; border-radius: 10px; background: #FFFFFF"></button>
<button type="button" aria-label="Jo to Alex, allowed" style="height: 44px; border: 1.5px dashed #8C7B68; border-radius: 10px; background: #FFFFFF"></button>
<button type="button" aria-label="Jo to Priya, blocked" style="height: 44px; border: 1.5px solid #B3262E; border-radius: 10px; background: #B3262E; color: #FFFFFF; font-size: 18px; font-weight: 700; font-family: inherit">×</button>
<button type="button" disabled aria-label="Jo to Jo, not applicable" style="height: 44px; border: 1.5px solid #E7DCCB; border-radius: 10px; background: #EDE4D3"></button>
<button type="button" aria-label="Jo to Mia, allowed" style="height: 44px; border: 1.5px dashed #8C7B68; border-radius: 10px; background: #FFFFFF"></button>
<span style="font-size: 12px; font-weight: 700">Mia</span>
<button type="button" aria-label="Mia to Sam, allowed" style="height: 44px; border: 1.5px dashed #8C7B68; border-radius: 10px; background: #FFFFFF"></button>
<button type="button" aria-label="Mia to Alex, allowed" style="height: 44px; border: 1.5px dashed #8C7B68; border-radius: 10px; background: #FFFFFF"></button>
<button type="button" aria-label="Mia to Priya, allowed" style="height: 44px; border: 1.5px dashed #8C7B68; border-radius: 10px; background: #FFFFFF"></button>
<button type="button" aria-label="Mia to Jo, allowed" style="height: 44px; border: 1.5px dashed #8C7B68; border-radius: 10px; background: #FFFFFF"></button>
<button type="button" disabled aria-label="Mia to Mia, not applicable" style="height: 44px; border: 1.5px solid #E7DCCB; border-radius: 10px; background: #EDE4D3"></button>
</div>
</div>
<div style="display: flex; align-items: center; gap: 10px; min-height: 40px">
<input id="oneway" type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #1F4D3A">
<label for="oneway" style="font-size: 14px">One-way only (don't mirror)</label>
</div>
<div style="display: flex; align-items: flex-start; gap: 10px; min-height: 44px">
<input id="showex" type="checkbox" style="width: 22px; height: 22px; margin: 0; flex-shrink: 0; accent-color: #1F4D3A">
<label for="showex" style="font-size: 14px; display: flex; flex-direction: column; gap: 2px"><span>Let participants see exclusions</span></label>
</div>
<button type="button" style="height: 44px; border: 1.5px solid #1F4D3A; border-radius: 12px; background: transparent; color: #1F4D3A; font-size: 14px; font-weight: 700; font-family: inherit">Group these people (e.g. a couple)</button>
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #1F4D3A">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F4D3A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.500l4.500 4.500L19 7.500"/></svg>
A valid draw is still possible
</div>
<button type="button" style="height: 52px; border: none; border-radius: 14px; background: #B3262E; color: #FFFFFF; font-size: 16px; font-weight: 700; font-family: inherit">Save exclusions</button>
</div>
</div>
</body>
</html>
